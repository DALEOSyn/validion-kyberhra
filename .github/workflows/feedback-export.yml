name: Feedback export

# Copies pilot feedback (issues labelled "spatna-vazba", see docs/FEEDBACK.md) into docs/feedback/ and opens a pull
# request with the update. Runs weekly and on demand; never on pull requests, so fork code never reaches the runner.
# A pull request opened with GITHUB_TOKEN does not start CI by itself: run CI on it by hand (it only touches docs/feedback/).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: feedback-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: [self-hosted]
    timeout-minutes: 10
    # The write token is given only to the steps that call the API or push, never to npm (lifecycle scripts off too).
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Make sure the feedback labels exist (the issue forms apply them)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make_label() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/labels" \
              -d "{\"name\":\"$1\",\"color\":\"$2\",\"description\":\"$3\"}")
            case "$code" in 201|422) ;; *) echo "label $1: HTTP $code"; exit 1 ;; esac
          }
          make_label spatna-vazba 0e8a16 'Pilot feedback (exported to docs/feedback)'
          make_label lekcia 1d76db 'Pilot lesson report from a teacher'
          make_label recenzia 5319e7 'Expert review'
          make_label pripomienka fbca04 'Comment or bug from an adult player'
          make_label hra c5def5 'Comment from the in-game comment box, pasted from e-mail by a maintainer'
          make_label schvalene 0e8a16 'Checked for personal data by a maintainer; only these are exported'
          make_label skryt b60205 'Keep out of the export (personal data, spam)'

      - name: Export
        run: npx tsx scripts/feedback-export.ts --repo "$REPO"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open a pull request when the export changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          # SUMMARY.md carries the date; only the CSV decides whether anything new arrived.
          if git diff --quiet -- docs/feedback/feedback.csv && git ls-files --error-unmatch docs/feedback/feedback.csv >/dev/null 2>&1; then
            echo "No new feedback."; exit 0
          fi
          branch="feedback/export-$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add docs/feedback
          git commit -m "Feedback export $(date -u +%Y-%m-%d)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # Token through the environment, not the command line (visible to other processes on the runner).
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --force origin "$branch"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/pulls" \
            -d "{\"title\":\"Feedback export $(date -u +%Y-%m-%d)\",\"head\":\"$branch\",\"base\":\"$BASE\",\"body\":\"Automatic export of approved feedback issues (spatna-vazba + schvalene). See docs/FEEDBACK.md.\"}" \
            -o /dev/null -w 'PR request: HTTP %{http_code}\n'
