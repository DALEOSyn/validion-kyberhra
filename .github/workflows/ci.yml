name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runs on Roman's self-hosted runner. Fork PRs must never run code on it: every job is skipped unless the event is
# a push or a pull request from a branch of this repository. Before the repository goes public, also turn on
# "Require approval for all outside collaborators" (Settings > Actions > General).
#
# Runner prerequisites (see README, "CI"): Node 22, and a Playwright Chromium matching @playwright/test, found
# through PLAYWRIGHT_BROWSERS_PATH or the default cache. The e2e job downloads Chromium only when none is found,
# and never with --with-deps (that needs sudo).
#
# Third-party actions are pinned by full commit SHA (same pins as the Scam Atlas repositories; the tag is in the comment).
jobs:
  checks:
    name: typecheck, lint, test, red lines, build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run redline
      - run: npm run build

  e2e:
    name: e2e play-through, axe, offline (Playwright, --trace off)
    needs: checks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the runner's Chromium, download it only if missing
        run: |
          if node -e "const { chromium } = require('@playwright/test'); process.exit(require('node:fs').existsSync(chromium.executablePath()) ? 0 : 1)"; then
            echo "Playwright Chromium found."
          else
            echo "No Playwright Chromium found: downloading it (no system deps)."
            npx playwright install chromium
          fi
      - run: npm run e2e
