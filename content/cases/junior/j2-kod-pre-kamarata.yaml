# J2 "Kód pre kamaráta" (docs/CASE_SPECS.md J2). Schema: docs/CONTENT_SCHEMA.md
# Facts: docs/SOURCES.md J2. A friend asking directly for the code is our framing of the
# general "never share a code" rule (SK-CERT, MV SR); it is not presented as a quoted SK-CERT case.
id: j2-kod-pre-kamarata
track: junior
number: 2
title: Kód pre kamaráta
summary: Tomáš v chate pýta kód, ktorý práve prišiel na tvoj mobil.
risk: [stranger]
sources:
  - sk-skcert-whatsapp-vote-2026
  - sk-skcert-nova-vlna-2025
  - sk-minv-pk-podvod-leaflet
  - sk-skcert-report-incident
  - sk-skcert-hacked-accounts-2018

recall:
  question: "Pamätáš si pravidlo z minulého prípadu? Vyber koniec vety. „Keď výhra chce prihlásenie cez odkaz, …“"
  options:
    - { id: own-way, text: "tak otvor hru vlastnou cestou.", correct: true }
    - { id: ask, text: "tak sa odosielateľa opýtaj, či je to pravé." }
    - { id: hurry, text: "tak sa prihlás rýchlo, kým výhra platí." }
  feedback: "Keď výhra chce prihlásenie cez odkaz, tak otvor hru vlastnou cestou."

intro:
  stamp: Prípad č. 2 · Kód pre kamaráta
  lines:
    - speaker: fuzik
      text: Haf. Tvoj mobil zabzučal. Dve správy naraz.
    - speaker: mira
      text: Skôr než odpíšeš, preskúmaj obe. Nájdi aspoň 3 stopy.
  button: Vziať lupu

evidence:
  - kind: sms
    label: Dôkaz A · SMS
    header: SMS · BZUK
    meta: "16:02"
    aria_label: SMS správa od aplikácie Bzuk
    lines:
      - style: sender
        segments:
          - text: BZUK
            decoy: Kód je pravý. Problém nie je SMS, ale kto ju od teba chce.
      - segments:
          - text: "Bzuk: tvoj overovací kód na prihlásenie je 482 913."
            clue:
              id: unasked
              hint: "Stopa: kód prišiel, hoci sa nikam neprihlasuješ. Niekto skúša vstúpiť do účtu."
      - segments:
          - text: Nikomu ho neposielaj, ani kamarátom.
            clue:
              id: warning
              hint: "Stopa: sama SMS hovorí, komu kód patrí. Nikomu."

  - kind: chat
    label: Dôkaz B · Chat s Tomášom
    header: BZUK · Tomáš 🎮
    meta: "16:03"
    aria_label: Správy od Tomáša v aplikácii Bzuk
    lines:
      - style: sender
        segments:
          - text: "[fotka: Tomáš s loptou] Tomáš 🎮"
            decoy: Meno a fotka sú naozaj Tomášove. Ukradnutý účet vyzerá presne ako ten pravý.
          - " · stav: "
          - text: 🐉
            decoy: Podpis nič nedokazuje. Ale toho draka už poznáš.
      - segments:
          - text: ahoj, prišla ti teraz SMS s kódom? omylom som tam dal tvoje číslo, pošli mi ho sem
            clue:
              id: askcode
              hint: "Stopa: pýta kód, ktorý prišiel tebe. Kód nikdy nikomu, ani kamarátovi."
      - segments:
          - text: prosím, rýchlo, o 5 minút začína
            clue:
              id: hurry
              hint: "Stopa: zhon. Kto ťa ženie, nechce, aby bol čas na overenie."
          - " "
          - text: turnaj v Kryptorii
            decoy: Tomáš Kryptoriu naozaj hrá. Kto ukradne účet, vidí aj staré správy.
      - segments:
          - text: nevolaj, som v autobuse a nemôžem hovoriť
            clue:
              id: nocall
              hint: "Stopa: nechce hovor. A práve hovor na Tomášovo známe číslo to overí."

scan:
  min_clues: 3
  prompt: Ťukni na časť správy, ktorá ti nesedí. Pozri sa na obe.
  button: Rozhodnúť sa

decision:
  title: Čo urobíš s kódom?
  prompt:
    - speaker: mira
      text: Tomáš čaká. Čo urobíš?
  next_button: "Rýchly výcvik: Dôvera alebo pasca"
  options:
    - id: send
      text: Poslať kód. Veď je to Tomáš a turnaj o chvíľu začína.
      outcome: bad
      label: Účet je preč
      consequence: Do tvojho Bzuku sa prihlási niekto cudzí. O chvíľu z neho idú rovnaké správy tvojim kamarátom.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: povedať to dospelému a v nastaveniach Bzuku odpojiť cudzie zariadenia."
    - id: ask
      text: Najprv sa ho v chate opýtať „Si to naozaj ty, Tomáš?“
      outcome: ok
      label: Skoro
      consequence: Odpoveď príde hneď, „jasné, že som to ja, rýchlo“. Kto ukradol účet, sa neprizná.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: overiť to inou cestou, napríklad hovorom."
    - id: verify
      text: Kód neposlať, Tomášovi zavolať na známe číslo, povedať to Babi Zore.
      outcome: best
      tells_adult: true
      label: Prípad vyriešený
      consequence: "Ešte kým vytáčaš, otvoria sa dvere. Tomáš: „Niekto mi ukradol Bzuk. Neviem sa prihlásiť.“ S Babi Zorou obnoví účet a kamarátov varuje inou cestou."
      calm: Presne tak. Kód si nechať a overiť inou cestou.

trust_or_trap:
  items:
    - source: Práve sa prihlasuješ do Bzuku na novom tablete · SMS BZUK
      text: Tvoj kód je 731 205. Nikomu ho neposielaj.
      answer: trust
      why: Kód patrí k prihláseniu, ktoré práve robíš. Zadaj ho len do aplikácie, nikomu ho neposielaj.
    - source: Bzuk · Lea
      text: ahoj, môžeš mi poslať kód, čo ti príde? chcem ťa pridať do súťaže
      answer: trap
      why: Kód nikdy nikomu, ani kamarátke. Jej účet mohol niekto ukradnúť. Zavolaj jej.
    - source: Bzuk · Babi Zora
      text: Mám čerstvé rožky. Príďte dole, kým sú teplé.
      answer: trust
      why: Bežná správa. Nič od teba nechce.
    - source: E-mail · Podpora Kryptoria
      text: Napíšte nám kód zo SMS, aby sme overili váš účet.
      answer: trap
      why: Kód zo SMS sa zadáva len do aplikácie. Nikomu ho nepíš, ani „podpore“.

debrief:
  rule: Keď niekto chce kód z tvojho telefónu, tak ho nepošli nikomu.
  clues:
    - text: Kód prišiel, hoci sa nikam neprihlasuješ.
      clue: unasked
    - text: Niekto ten kód od teba chce.
      clue: askcode
    - text: Zhon, o chvíľu vraj začína turnaj.
      clue: hurry
    - text: Nechce hovor. Práve hovor by to overil.
      clue: nocall
  note: Kamarátovi radšej zavolaj na jeho známe číslo.
  if_it_happened:
    - Povedz to hneď dospelému, ktorému dôveruješ. Môže to aj nahlásiť.
    - V nastaveniach Bzuku odpoj zariadenia, ktoré nepoznáš. Zmazať aplikáciu nestačí.
    - Zmeň heslo a zapni dvojstupňové overenie.
    - Varuj kamarátov inou cestou, nech na správy z tvojho účtu nereagujú.
  story_clue:
    title: Stopa k Tieňovi č. 2
    text: V ukradnutom Tomášovom profile sa objavil drak 🐉. Tieň píše z ukradnutých účtov.
  next_teaser: "Ďalší prípad: Zámok na účte. Klubový účet zrazu rozdáva čudné výhry."

stars:
  - type: clues
    min: 4
    label: Nájsť aspoň 4 stopy, neťukať na všetko
  - type: decision_best
    label: Vybrať najbezpečnejšiu radu
  - type: trust_or_trap
    min: 3
    label: Aspoň 3 správne vo výcviku
