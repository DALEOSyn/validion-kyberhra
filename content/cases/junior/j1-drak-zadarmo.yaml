# J1 "Drak zadarmo" (docs/CASE_SPECS.md J1; ported from prototypes/stopa-case1-v0.2.html). Schema: docs/CONTENT_SCHEMA.md
id: j1-drak-zadarmo
track: junior
number: 1
title: Drak zadarmo
summary: Lea vraj vyhrala draka do hry. Stačí sa prihlásiť cez odkaz.
risk: [stranger]
# Facts: docs/SOURCES.md J1. ch-ncsc-gamer-phishing-2024 is supporting only (non-EU).
sources:
  - sk-skcert-online-games-2020
  - eu-bik-gaming-teachers
  - eu-bik-ie-scams-young-2026
  - sk-skcert-hacked-accounts-2018
  - eu-esas-ai-scams-factsheet-sk
  - ch-ncsc-gamer-phishing-2024

intro:
  stamp: Prípad č. 1 · Drak zadarmo
  lines:
    - speaker: mira
      text: Vitaj v STOPE. Práve prišla klientka.
    - speaker: lea
      text: prišla mi táto správa v Bzuku. vraj som vyhrala draka do Kryptorie. mám kliknúť?
    - speaker: mira
      text: Nájdi aspoň 3 stopy. Prvú ti ukážem. Odosielateľa Lea nepozná a „Oficial“ si do mena dá ktokoľvek.
    - speaker: fuzik
      text: Haf. Bzuk aj Kryptoria sú vymyslené. Triky sú skutočné.
  button: Vziať lupu

evidence:
  - kind: chat
    label: Dôkaz A · Leina správa
    header: BZUK · súkromná správa
    meta: "19:41"
    aria_label: Správa v aplikácii Bzuk
    lines:
      - style: sender
        segments:
          - text: Kryptoria_Oficial_Team
            clue:
              id: sender
              hint: "Stopa: neznámy účet. Slovo „Oficial“ si do mena dá ktokoľvek."
          - " · nový kontakt"
      - segments:
          - text: GRATULUJEME 🎉
            decoy: Toto samo osebe stopa nie je. Sleduj, čo od teba chcú.
          - " "
          - text: "Si medzi 50 výhercami: 5 000 kryštálov a skin Ohnivý drak zadarmo."
            clue:
              id: prize
              hint: "Stopa: veľká výhra zadarmo."
      - segments:
          - text: Výhru si vyzdvihni do 15 minút, inak prepadne.
            clue:
              id: hurry
              hint: "Stopa: časový tlak. Kto ťa ženie, nechce, aby bol čas na overenie."
      - style: link
        segments:
          - text: kryptoria-odmeny.example/login
            clue:
              id: link
              hint: "Stopa: cudzí odkaz. Do hry choď cez jej aplikáciu alebo stránku, ktorú otvoríš vlastnou cestou."
      - segments:
          - text: Prihlás sa menom a heslom do hry, aby sme ti výhru poslali.
            clue:
              id: pass
              hint: "Stopa: pýtajú heslo. Na poslanie výhry ho nikto nepotrebuje."
      - style: meta
        segments:
          - text: Tím Kryptoria 🐉
            decoy: Podpis nič nedokazuje. Ale toho draka si zapamätaj.

scan:
  min_clues: 3
  pre_found: [sender]
  prompt: Ťukni na časť správy, ktorá ti nesedí.
  button: Poradiť Lei

decision:
  title: Čo poradíš klientke?
  prompt:
    - speaker: lea
      text: tak čo mám spraviť? ten drak je fakt super
  next_button: "Rýchly výcvik: Dôvera alebo pasca"
  options:
    - id: click
      text: Kliknúť na odkaz a rýchlo sa prihlásiť, kým výhra o 15 minút neprepadne.
      outcome: bad
      label: Účet je preč
      consequence: Stránka vyzerá ako Kryptoria, ale patrí Tieňovi. Po zadaní hesla sa do Leinho účtu prihlási niekto iný. Žiadny drak.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: otvoriť hru priamo a zmeniť heslo."
    - id: ask
      text: Odpísať tomu účtu a opýtať sa, či je to naozaj pravé.
      outcome: ok
      label: Skoro
      consequence: Účet hneď odpíše „Áno, je to 100 % pravé, ponáhľaj sa.“ Podvodník sa neprizná.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: overovať inou cestou, nie u toho, kto správu poslal."
    - id: verify
      text: Neklikať, otvoriť Kryptoriu priamo, účet nahlásiť a ukázať to dospelému.
      outcome: best
      tells_adult: true
      label: Prípad vyriešený
      consequence: Lea otvorí Kryptoriu vlastnou cestou. V hre žiadna výhra nie je. Správu ukáže mame a účet v Bzuku nahlási. Tieň odchádza naprázdno.
      calm: Presne tak. Overiť vlastnou cestou a povedať to dospelému.

trust_or_trap:
  items:
    - source: Launcher Pixelbrána · upozornenie v aplikácii
      text: Nová aktualizácia Kryptorie je pripravená. Spusti ju tlačidlom Aktualizovať.
      answer: trust
      why: Prišlo to v launcheri, ktorý máš nainštalovaný, a nepýta heslo.
    - source: Bzuk · kamarát Tomáš
      text: čau, prišiel ti teraz SMS kód? pošli mi ho prosím, potrebujem ho na turnaj
      answer: trap
      why: Kód zo SMS je kľúč k tvojmu účtu. Nedávaj ho nikomu, ani kamarátovi.
    - source: Video · komentár pod videom
      text: GENERÁTOR KRYŠTÁLOV ZADARMO. Choď na kryst-gen.example a zadaj meno a heslo do Kryptorie.
      answer: trap
      why: Kryštály za tvoje heslo sú známy trik. Hľadaj ich len priamo v hre.
    - source: Kryptoria · obchod v hre
      text: "Víkendová akcia: skin Mesačná líška za 200 kryštálov."
      answer: trust
      why: Je to v obchode priamo v hre. Ak by išlo o skutočné peniaze, poraď sa najprv s rodičom.
    - source: E-mail · podpora-kryptoria@ucet.example
      text: "Váš účet bude dnes zrušený. Overte heslo tu: kryptoria-support.example"
      answer: trap
      why: Strašenie a odkaz, ktorý pýta heslo. Otvor hru vlastnou cestou a pozri účet tam.

debrief:
  rule: Keď výhra chce prihlásenie cez odkaz, tak otvor hru vlastnou cestou.
  clues:
    - text: Výhra zadarmo od účtu, ktorý nepoznáš.
      clue: prize
    - text: Časový tlak „do 15 minút, inak prepadne“.
      clue: hurry
    - text: Cudzí odkaz do hry.
      clue: link
    - text: Správa pýta meno a heslo.
      clue: pass
  if_it_happened:
    - Povedz to dospelému, ktorému dôveruješ.
    - Otvor hru vlastnou cestou a zmeň heslo. Aj všade, kde bolo rovnaké.
    - Zapni dvojstupňové overenie.
    - Ak sa nevieš prihlásiť, použi oficiálne obnovenie účtu v hre.
  story_clue:
    title: Stopa k Tieňovi č. 1
    text: Správu podpísal malý drak 🐉. Kto za ním stojí?
  next_teaser: "Ďalší prípad: Kód pre kamaráta. Tvoj mobil zabzučí dvakrát."

stars:
  - type: clues
    min: 4
    label: Nájsť aspoň 4 stopy, neťukať na všetko
  - type: decision_best
    label: Vybrať najbezpečnejšiu radu
  - type: trust_or_trap
    min: 4
    label: Aspoň 4 správne vo výcviku
