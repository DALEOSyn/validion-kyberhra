# [PLACEHOLDER] Teen case 1. A cut-down sketch of T1 "Ľahká brigáda" (docs/CASE_SPECS.md) that exists only so the
# teen track renders and every engine feature runs: two artefacts, decoys with a star limit, a chained consequence,
# a verify step with retry, a lock-up with ranks and distractors, missed clues, an arc scene. A scenario writer
# replaces this whole file (and renames it t1-lahka-brigada.yaml). Not reviewed. Never ship it.
id: t1-placeholder
track: teen
number: 1
title: "[PLACEHOLDER] Ľahká brigáda"
summary: "[PLACEHOLDER] Brigáda za 150 € týždenne z mobilu. Je to legit?"
placeholder: true
sources:
  - eu-europol-mule-jobs

intro:
  stamp: "[PLACEHOLDER] Spis č. 1 · Ľahká brigáda"
  lines:
    - speaker: sara
      text: Máme tip na epizódu. Overovací stôl, je to tvoje.
    - speaker: kristian
      text: Dax zo Záberu ponúka brigádu, 150 € týždenne z mobilu. Je to legit?
    - speaker: bielikova
      text: Pred éterom všetko overujeme. Aj to, čo vyzerá nevinne.
  button: Otvoriť spis

evidence:
  - kind: profile
    label: Dôkaz A · Príspevok na Záberi
    header: ZÁBER · @dax_brigady
    aria_label: Profil a príspevok na sociálnej sieti Záber
    lines:
      - style: sender
        segments:
          - text: Dax · Kvapka Partners · 48,2 tis. sledovateľov
            decoy: Sledovatelia sa dajú kúpiť. Nedokazujú nič dobré ani zlé. Sleduj, čo chce.
      - segments:
          - text: Hľadám 3 ľudí z Lipovca na brigádu z mobilu. 150 € týždenne za 10 minút denne.
            clue:
              id: pay
              hint: "Stopa: veľa peňazí za takmer nič."
      - segments:
          - text: Netreba skúsenosti.
            decoy: Veľa skutočných brigád skúsenosti nechce. Samo osebe to nevadí.
          - " "
          - text: Stačí mať 15+ a vlastný účet v banke. Píš DM.
            clue:
              id: account
              hint: "Stopa: hlavná podmienka je tvoj bankový účet. Taká „práca“ nie je brigáda."
  - kind: chat
    label: Dôkaz B · Správy od Daxa
    header: BZUK · Dax
    meta: "21:12"
    aria_label: Správy od Daxa v aplikácii Bzuk
    lines:
      - speaker: Dax
        segments:
          - text: Na tvoj účet príde platba. 90 % pošleš ďalej na účet, ktorý ti dám, 10 % je tvojich.
            clue:
              id: forward
              hint: "Stopa: cudzie peniaze na tvojom účte, ktoré máš poslať ďalej."
      - speaker: Dax
        segments:
          - text: A nikomu o tom nehovor 😉
            clue:
              id: secret
              hint: "Stopa: tajnosť. Dobrá brigáda sa nemusí skrývať pred rodičmi."
      - speaker: Dax
        segments:
          - text: Výplata každý piatok.
            decoy: Pravidelná výplata je normálna. Stopa je v tom, čo máš robiť s cudzími peniazmi.

scan:
  min_clues: 4
  button: Rozhodnúť

decision:
  title: Čo poradíš Kristiánovi?
  prompt:
    - speaker: kristian
      text: Tak čo, mám Daxovi odpísať?
  next_button: "Ďalej: ako to overiť"
  options:
    - id: try-once
      text: Skúsiť to raz s malou sumou a potom skončiť.
      outcome: bad
      label: Účet v problémoch
      consequence: Na Kristiánov účet príde 480 € od cudzej ženy. Dax píše, nech ich do hodiny pošle ďalej.
      later: O dva dni banka účet zablokuje a pýta sa, odkiaľ sú peniaze.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: ešte dnes to povedať rodičovi a spolu zavolať do banky."
    - id: number-only
      text: Poslať Daxovi len číslo účtu. Prihlasovacie údaje nie.
      outcome: bad
      label: Číslo účtu stačí
      consequence: Peniaze prídu rovnako.
      later: Dax začne tlačiť, nech ich pošle ďalej.
      calm: "Toto sa môže stať komukoľvek. Ďalší krok: neodpovedať a povedať to dospelému."
    - id: contract
      text: Vyžiadať si od Daxa zmluvu a názov firmy.
      outcome: ok
      label: Skoro
      consequence: Dax pošle pekné PDF so zmluvou a logom.
      later: Vyrobiť ho je ľahké. A o Kristiánov účet tu ide stále.
      calm: "Ďalší krok: overovať mimo Daxa a povedať to dospelému."
    - id: refuse
      text: Odmietnuť. Daxa zablokovať a nahlásiť. Povedať to rodičovi alebo pani Bielikovej.
      outcome: best
      label: Správne
      consequence: Kristián Daxovi neodpíše a profil nahlási. Doma to povie mame.
      calm: Presne tak. Odmietnuť a povedať to dospelému.

verify:
  title: Patrik pod príspevkom píše, že výplata vždy prišla. Ako to overiť?
  options:
    - id: reply-comment
      text: Odpísať Patrikovi pod komentár na Záberi.
      outcome: bad
      label: Rovnaký kanál
      consequence: Odpovie ten, kto komentár napísal. Ak je účet falošný, všetko potvrdí.
      calm: Overuje sa inou cestou. Skús to znova.
    - id: ask-dax
      text: Napísať Daxovi, nech pošle Patrikov kontakt.
      outcome: bad
      label: Kontakt od podozrivého
      consequence: Kontakt od Daxa vedie späť k Daxovi.
      calm: Overuje sa inou cestou. Skús to znova.
    - id: ask-in-person
      text: Opýtať sa Patrika osobne v škole.
      outcome: best
      label: Iný kanál
      consequence: Patrik nemá o ničom tušenie. Taký komentár nikdy nenapísal.
      calm: Presne tak. Osobne alebo na známom čísle.
    - id: followers
      text: Pozrieť, koľko má Patrikov profil sledovateľov.
      outcome: bad
      label: Čísla nič neoveria
      consequence: Počet sledovateľov nepovie, kto komentár napísal.
      calm: Overuje sa inou cestou. Skús to znova.
  next_button: "Ďalej: Oto už povedal áno"

lock_up:
  title: Oto už povedal áno
  prompt: V akom poradí to má riešiť?
  steps:
    - id: stop
      text: "Prestať: Daxovi už nič neposielať a neodpovedať."
      rank: 1
    - id: tell-adult
      text: Ešte dnes to povedať dospelému, ktorému Oto dôveruje.
      rank: 2
    - id: call-bank
      text: S dospelým zavolať do banky na číslo zo zadnej strany karty alebo z aplikácie.
      rank: 3
    - id: police
      text: S dospelým to oznámiť polícii.
      rank: 4
    - id: report-profile
      text: Nahlásiť Daxov profil a varovať kamarátov.
      rank: 4
  distractors:
    - id: send-on
      text: Peniaze, ktoré už prišli, rýchlo poslať ďalej, nech je pokoj.
      hint: Toto nie. Peniaze nechaj tak a rieš to s bankou.
    - id: delete-chat
      text: Zmazať chat s Daxom.
      hint: Chat nemaž. Je to dôkaz, ktorý pomôže banke aj polícii.
  correct: Presne tak. Najprv zastaviť, potom dospelý a banka.

debrief:
  rule: Ak niekto chce tvoj účet, kartu alebo prihlásenie za peniaze, odmietni a povedz to dospelému.
  clues:
    - text: Veľa peňazí za takmer nič.
      clue: pay
    - text: Podmienkou je tvoj bankový účet.
      clue: account
    - text: Cudzie peniaze máš poslať ďalej.
      clue: forward
    - text: Tajnosť.
      clue: secret
  if_it_happened:
    - Prestaň a nič ďalej neposielaj.
    - Ešte dnes to povedz dospelému, ktorému dôveruješ.
    - S dospelým zavolaj do banky.
  story_clue:
    title: "[PLACEHOLDER] Do spisu: 1"
    text: Na platby Dax odkazuje na kontakt @kvapka_desk v Bzuku. Zapisujeme.

arc_scene:
  button: "[PLACEHOLDER] Záver príbehu"
  stamp: "[PLACEHOLDER] Spis uzavretý. Odvysielané."
  lines:
    - speaker: sara
      text: Spomaľ. Over si to inou cestou. Povedz to niekomu.
  closing: Táto scéna je len ukážka. Skutočná scéna príde po poslednom prípade trasy.

stars:
  - type: clues
    min: 4
    max_decoys: 2
  - type: decision_and_verify_best
  - type: lock_up
    max_errors: 1
