            clue:
              id: login
              hint: "Stopa: niekto je v Matejovom účte. Bez hesla, ktoré by mu Matej dal."
      - segments:
          - text: "Bzuk: správa odoslaná 23 kontaktom"
            clue:
              id: sent
              hint: "Stopa: správy, ktoré Matej nepísal."
      - segments:
          - text: "Záber: Heslo k účtu bolo zmenené. Ak ste to neboli vy, obnovte účet v aplikácii."
            clue:
              id: changed
              hint: "Stopa: zmenu hesla Matej nerobil."
      - segments:
          - text: "Kovoboj: sezóna 9 začína v piatok"
