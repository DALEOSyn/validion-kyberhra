# T2 · Cheat zadarmo (docs/CASE_SPECS.md T2; threats B2.4 → B3.1).
# Sourcing is thin for the cheat → infostealer link (docs/SOURCES.md T2). The case teaches only: games and add-ons
# from official stores or trusted sites, don't run downloaded cheats, programs that steal passwords exist, and the
# clean-device recovery order. "Switch off antivirus" and "locked archive" are supporting-only red flags
# (ch-ncsc-mods-cheats-2024). No claim that an SK/EU body warned about cheats; no malware names, files or install steps.
id: t2-cheat-zadarmo
track: teen
number: 2
title: Cheat zadarmo
summary: Matej si stiahol pomôcku na mierenie do Kovoboja. Ráno jeho účty robia veci, ktoré on nerobí.
sources:
