intro:
  stamp: Spis č. 2 · Cheat zadarmo
  lines:
    - speaker: sara
      text: "Z minulého spisu: keď za ľahkú prácu chcú tvoj účet, tak odmietni a povedz to dospelému. Dnes máme nový prípad."
    - speaker: matej
      text: Včera som stiahol cheat na Kovoboj. Nefungoval. A dnes ráno toto.
    - speaker: sara
      text: Toto sa môže stať komukoľvek. Rozoberieme to od začiatku. Video, stránka, mobil.
    - speaker: bielikova
      text: A potom poradie krokov. Na poradí tu záleží.
  button: Otvoriť spis

evidence:
  - kind: webpage
    label: Dôkaz A · Video na Klipku
    header: KLIPKO · video
    aria_label: Stránka s videom na platforme Klipko
    lines:
      - style: title
        segments:
          - text: KOVOBOJ aim helper ZADARMO · funguje 2026
            clue:
              id: cheat
              hint: "Stopa: cheat z neznámeho zdroja. Aj keby fungoval, za cheaty môže prísť trvalý zákaz účtu."
      - style: meta
        segments:
          - text: 1,2 mil. zhliadnutí
            decoy: Zhliadnutia nič nedokazujú, dobré ani zlé.
          - " · pred 6 dňami"
      - segments:
          - text: "[náhľad videa: záber z Kovoboja, zameriavač sa sám drží na súperovi]"
            decoy: Obrázok z hry spraví každý.
      - segments:
          - text: Stiahni z kovo-tools.example (v obchode to zakázali)
            clue:
              id: offstore
              hint: "Stopa: mimo oficiálneho obchodu. Hry a doplnky len z oficiálneho obchodu alebo dôveryhodnej stránky."
      - style: meta
        segments:
          - "Komentáre"
      - segments:
          - text: "„funguje díky 🔥“ · „funguje díky 🔥“ · „funguje díky 🔥“ (tri rôzne účty)"
            decoy: Komentáre nič nedokazujú, dobré ani zlé. Sleduj, odkiaľ máš sťahovať.

  - kind: webpage
    label: Dôkaz B · Stránka na stiahnutie
    header: Prehliadač
    aria_label: Webová stránka, z ktorej sa sťahuje cheat
    lines:
      - style: address
        segments:
          - text: kovo-tools.example/download
            clue:
              id: domain
              hint: "Stopa: adresa nepatrí vývojárovi hry. Kovoboj má stránku kovoboj.example."
      - style: title
        segments:
          - "Kovoboj Aim Helper 3.2"
      - segments:
          - text: Pred inštaláciou vypni antivírus. Hlási falošný poplach, lebo cheat je neviditeľný.
            clue:
              id: av
              hint: "Stopa: žiadosť vypnúť ochranu. Ochranu kvôli sťahovaniu nevypínaj."
      - segments:
          - text: "Archív je zamknutý, heslo: 2026"
            clue:
              id: archive
              hint: "Stopa: zamknutý archív s heslom pri cheate je ďalší varovný znak."
      - style: meta
        segments:
          - text: Veľkosť 14 MB · aktualizované 2. 11.
            decoy: Veľkosť a dátum nič neprezradia.
      - style: button
        segments:
          - "STIAHNUŤ"
      - style: meta
        segments:
          - "Podpora: @kvapka_desk v Bzuku"

  - kind: popup
    label: Dôkaz C · Matejov mobil ráno
    header: Zamknutá obrazovka · upozornenia
    meta: "7:42"
    aria_label: Upozornenia na zamknutej obrazovke Matejovho mobilu
