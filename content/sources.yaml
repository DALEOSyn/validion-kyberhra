  - id: eu-bik-gaming-teachers
    publisher: Better Internet for Kids (European Commission / Insafe)
    title: "Online gaming (learning corner for teachers and educators)"
    url: https://better-internet-for-kids.europa.eu/en/learning-corners/teachers-and-educators/online-gaming
    published: "n/d (chart image timestamp suggests 2023-06)"
    accessed: 2026-11-25
    region: EU
    tier: 1
    used_for: [J1, T2]
    notes: "Opened 2026-11-25. 'Some players may try to deceive others with promises of virtual items, cheats, or prizes'; 'players may offer to grant VIP status or gift free items to a child in exchange for their account password'; 'Once a scammer has the password, they are able to lock the child out of their account'; 'Players may be targeted by scams and frauds that offer fake in-game items or currency in exchange for real money'; cheating with 'hacks or custom programs' risks being 'permanently banned from the game and losing their account'. Does NOT mention phishing pages, malware, mods or two-factor login."

  - id: eu-bik-ie-scams-young-2026
    publisher: Better Internet for Kids (article by the Irish Safer Internet Centre)
    title: "Online scams and young people: what parents need to know"
    url: https://better-internet-for-kids.europa.eu/en/news/online-scams-and-young-people-what-parents-need-know
    published: 2026-01-08
    accessed: 2026-11-25
    region: EU
    tier: 1
    used_for: [J1, T1, T4]
    notes: "Opened 2026-11-25. EU portal, Irish-authored: its reporting route (Irish police) is NOT for Slovak players. 'links that offer free game credits or prizes'; 'offers of exclusive items - such as gaming skins or limited-edition merchandise'; criminals 'recruit teens to receive and transfer stolen money, usually in exchange for a cut of the money or a flashy gift'; many young people 'may not fully understand that this activity... is illegal'; investment scams 'frequently use social media ads or influencers to create a sense of credibility and urgency'; fraudsters can create 'deepfake videos, cloned voices' (not tied to young people). Advice: 'Stop, Think, Check'; if a child falls for a scam, 'Reassure them. They are not in trouble.'; contact the bank if financial details were shared, reset passwords, turn on two-factor authentication. The only EU source found that names skins. Re-checked 2026-11-25 (fact check): parents' steps include 'Report the scam on the relevant platform.' and 'Gather any details: screenshots, emails, account names.'; NO advice on blocking, warning friends, or what to do once a child is already a money mule."

