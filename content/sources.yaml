  # =============================================================== Slovakia: national CERTs (tier 2)
  - id: sk-skcert-online-games-2020
    publisher: SK-CERT (Národné centrum kybernetickej bezpečnosti, NBÚ)
    title: "The National Cyber Security Centre SK-CERT recommends to pay attention to security when playing online games"
    url: https://www.sk-cert.sk/en/the-national-cyber-security-centre-sk-cert-recommends-to-pay-attention-to-security-when-playing-online-games/index.html
    published: 2020-09-21
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J1, J3, T2]
    notes: "Opened 2026-11-25. OLDER (2020), English page. 'Do not respond to private messages or messages in a game chat that prompt you to provide your login'; 'Do not share your game account login information with anyone'; 'Do not click on suspicious attachments and links in emails' (phishing emails carry malicious code); 'Use complex and hard-to-guess passwords'; 'If you have different game accounts, use a different password for each one'; 'Set up two-factor authentication to log into your account (avoid SMS authentication if possible)'; 'Buy games and game content only in official stores of game platforms or through trusted websites'; fake websites 'that offer cheaper games or premium content' steal personal and payment data; use in-game report and block tools. Does NOT mention skins, free currency, cheats-as-malware, mods or account-recovery steps. The core Slovak source for J1."

  - id: sk-skcert-passwords-2018
    publisher: SK-CERT (NBÚ)
    title: "Passwords and Securing Your Accounts"
    url: https://www.sk-cert.sk/en/tips-and-tricks/security-recommendations/securing-accounts-and-devices/passwords-and-securing-your-accounts/index.html
    published: "2018-03-05 (updated 2018-03-16)"
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J3]
    notes: "Opened 2026-11-25. OLDER (2018) but consistent with current practice. 'A strong password is a sentence that is at least 12 characters long'; 'Focus on positive sentences or phrases that you like to think about and are easy to remember'; 'On many sites, you can even use spaces!'; 'Having separate passwords for every account helps to thwart cybercriminals'; a password manager is an option; for key accounts (email, banking, social media) enable 'the strongest authentication tools available, such as biometrics, security keys or a unique one-time code through an app on your mobile device'. No SMS or push methods; no breach-check advice. Footer date 2026-11-19 is site-wide."

  - id: sk-skcert-hacked-accounts-2018
    publisher: SK-CERT (NBÚ)
    title: "Hacked Accounts"
    url: https://www.sk-cert.sk/en/tips-and-tricks/security-recommendations/securing-accounts-and-devices/hacked-accounts/index.html
    published: "2018-03-05 (updated 2018-03-16)"
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J2, J3, T2, T3]
    notes: "Opened 2026-11-25. OLDER (2018). Signs: posts you never made; 'A friend, family member or colleague reports getting e-mail from you that you never sent'; data lost via breach, malware or a lost device. Do: notify contacts; scan for malware; 'Change passwords to all accounts that have been compromised and other key accounts as soon as possible'; if locked out, contact the service provider and follow its account-recovery steps. No 2FA step, no report step."

  - id: sk-skcert-whatsapp-vote-2026
    publisher: NCKB / SK-CERT (NBÚ)
    title: "Podvodníci pokračujú v úspešnej WhatsApp kampani imitujúcej súťaž"
    url: https://www.sk-cert.sk/sk/podvodnici-pokracuju-v-uspesnej-whatsapp-kampani-imitujucej-sutaz/index.html
    published: 2026-10-06
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J2, J3, T3]
    notes: "Re-opened 2026-11-25. 'Správa odoslaná z kompromitovaného konta vyzýva na hlasovanie v súťaži'; a fake page asks for your phone number and 'overovacieho kódu', which links a new device; 'Nikdy nezdieľajte vaše verifikačné kódy s inými osobami'; before opening a shared link 'telefonicky kontaktujte odosielateľa'; 'Aktivujte dvojfaktorovú autentifikáciu pre vašu platformu'; unlink unknown devices manually ('nestačí aplikáciu WhatsApp vypnúť alebo odinštalovať'); warn contacts; report to the National Cyber Security Centre with the exact link. Describes a page asking for the code, NOT a friend asking you to forward it directly. Names a real app: never in game content."

  - id: sk-skcert-nova-vlna-2025
    publisher: SK-CERT (NBÚ)
    title: "Nová vlna podvodných kampaní"
    url: https://www.sk-cert.sk/sk/nova-vlna-podvodnych-kampani/index.html
    published: 2025-04-11
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J2]
    notes: "Re-opened 2026-11-25. 'obeti príde správa od známeho s prosbou o hlasovanie'; the attacker copies the contact list and 'na všetky kontakty obete začnú šíriť tú istú správu'; scanning a code links the account to the attacker's device. After: unlink all devices, warn contacts ('aby v žiadnom prípade neotvárali linku'), change shared passwords, call the bank if card data were shared, police if ID photos were shared."

  - id: sk-skcert-fakeapps-2018
    publisher: SK-CERT (NBÚ)
    title: "FakeApps world"
    url: https://www.sk-cert.sk/en/fakeapps-world/index.html
    published: 2018-03-15
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J4]
    notes: "Opened 2026-11-25. OLDER (2018). Fake apps that do not do what they claim, incl. adware and data-stealing apps; one fake app in an OFFICIAL store had over a million downloads. Advice: verify legitimacy and the developer; 'Study in detail which permissions the application asks for during the installation'; read reviews or do not install; 'Do not install applications from unverified sources.' Does NOT mention pop-ups or fake virus warnings."

  - id: sk-skcert-malicious-app-2025
    publisher: SK-CERT (NBÚ)
    title: "Škodlivá mobilná aplikácia, ktorá cieli aj na slovenských zákazníkov"
    url: https://www.sk-cert.sk/sk/skodliva-mobilna-aplikacia-ktora-cieli-aj-na-slovenskych-zakaznikov/index.html
    published: 2025-09-10
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J4, T2]
    notes: "Re-opened 2026-11-25. Lure: 'klamlivou reklamou'. 'Inštalujte aplikácie iba z oficiálnych „obchodov“.'; give apps only the permissions they need; do not let other apps install apps or use accessibility services; 'Ak si aplikácia žiada neprimerané prístupové práva, odporúčame žiadosť zamietnuť a aplikáciu odinštalovať.' If installed: factory reset (control can persist after deletion), change all passwords, tell the bank. The real lure was an ADULT-content app: never reuse that lure in a children's game. Does NOT mention fake virus pop-ups."

  - id: sk-skcert-report-incident
    publisher: SK-CERT (NBÚ)
    title: "Report an incident"
    url: https://www.sk-cert.sk/en/tips-and-tricks/report-an-incident/index.html
    published: "2025-08-12 (updated 2026-09-16)"
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [HELP, J2, T3]
    notes: "Re-opened 2026-11-25. Public web form (linked as https://jiskb.nbu.gov.sk/public-report/incident, 'Use this option if you have no access to JISKB, incl. reports from public'; form not opened on its own) and email published as incident(at)nbu.gov.sk ('for cases where the other methods can't be used'; PGP recommended). No phone line."

  - id: sk-skcert-tech-support-2020
    publisher: SK-CERT (NBÚ)
    title: "Do you have calls from Microsoft tech support? It could be a scam"
    url: https://www.sk-cert.sk/en/do-you-have-calls-from-microsoft-tech-support-it-could-be-a-scam/index.html
    published: 2020-09-28
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J4, T2]
    notes: "Opened 2026-11-25 (fraud-researcher fact check). OLDER (2020), English page. Scammers show 'fake error messages through compromised websites, advertisements, applications' to 'trick you into calling an indicated technical support hotline'; 'If you see a phone number with a warning message from Microsoft or other company, do not call it.'; 'Error messages never include a phone number.' (stated for the software vendor's own messages); 'you may be asked to install applications that allow remote access to your device'. After: change passwords, contact the bank, uninstall the requested apps, update, antivirus scan, 'consider resetting the device and report the incident to the National Cyber Security Centre SK-CERT and the police.' The only SK/EU source found that backs J4's 'do not call the number in the warning' clue and the fake-warning lure on websites. Names a real software company: never in game content."

  - id: sk-skcert-kedy-nas-kontaktovat
    publisher: SK-CERT (NBÚ)
    title: "Kedy nás kontaktovať"
    url: https://www.sk-cert.sk/sk/rady-a-navody/kedy-nas-kontaktovat/index.html
    published: "2018-01-10 (updated 2020-04-06)"
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [HELP]
    notes: "Opened 2026-11-25. Slovak page: contact SK-CERT if you are 'obeťou kybernetického útoku'; report via 'formulár na nahlásenie incidentu' or incident(at)nbu.gov.sk; no phone. 'Nahlásiť incident' is the Slovak site's navigation label, so the help-screen label is accurate. The current form details are on the English page (sk-skcert-report-incident)."

  - id: sk-csirt-passwords-infographic-2024
    publisher: CSIRT.SK (Vládna jednotka CSIRT, MIRRI SR)
    title: "Infografika: Heslá"
    url: https://CSIRT.SK/wp-content/uploads/2024/03/Infografika_Hesla_compressed.pdf
    published: "n/d (upload path 2024-03)"
    accessed: 2026-11-25
    region: SK
    tier: 2
    used_for: [J3]
    notes: "Opened 2026-11-25. 'Heslo má mať aspoň 12 až 16 znakov.'; 'Nepoužívajte slová, ktoré možno nájsť v slovníkoch.'; 'Pre každý z vašich online účtov použite iné heslo.'; 'Zvážte použitie aplikácie - správcu hesiel'; 'Vždy, keď je to možné, povoľte pre svoje účty dvojfaktorové overenie (overenie napríklad cez SMS, či e-mail).' Credits a commercial password-manager vendor as its source ('Zdroj: NordPass'): tier 2 host, vendor content. Its 'no dictionary words' line CONFLICTS with SK-CERT's passphrase advice: the game follows SK-CERT (a long sentence of words) and does not quote this line."

  - id: sk-csirt-ms-2026-06
    publisher: CSIRT.SK
    title: "Mesačná správa, jún 2026"
    url: https://csirt.sk/wp-content/uploads/2026/07/MS202606.pdf
    published: 2026-07
