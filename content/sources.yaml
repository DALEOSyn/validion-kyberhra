    title: "Online finančné podvody vo svete umelej inteligencie"
    url: https://www.eba.europa.eu/sites/default/files/2026-01/fa63af9a-bafd-4821-baee-48c7c8fb6490/Online%20financial%20frauds%20and%20scams%20in%20an%20AI%20world_SK.pdf
    published: "2025-12-15 (launch; SK file uploaded 2026-01 per URL path)"
    accessed: 2026-11-25
    region: EU
    tier: 1
    used_for: [J2, T4]
    notes: "Slovak edition, re-opened 2026-11-25. Verbatim: 'Naliehavá žiadosť o peniaze alebo osobné informácie, a to aj od niekoho, kto predstiera, že je rodinným príslušníkom'; 'Zavolajte alebo napíšte svojej rodine a priateľom pomocou známeho čísla prostredníctvom dôveryhodného kanála'; 'Dohodnite sa so svojou rodinou na „bezpečnom slove“'; 'Dávajte si pozor na „klonovaniu hlasu“' (the factsheet adds that AI speech can sound very natural); 'Toto sa nazýva „Deepfake“.'; 'Reklama obsahuje fotografiu celebrity a odporúčania, ktoré sú často falošné.'; 'Legitímne spoločnosti nikdy nebudú žiadať o vaše PIN kódy, heslá, prihlasovacie údaje k internetovému bankovníctvu'. If caught ('Čo robiť, keď ste sa stali obeťou podvodu'): stop transactions and contact, 'Okamžite informujte svoju banku alebo finančnú spoločnosť', change passwords on all devices. Aimed at adults."

