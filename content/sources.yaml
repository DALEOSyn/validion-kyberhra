# content/sources.yaml: sources for Kancelária STOPA (VALIDION kids' cybersecurity game).
# Owner: fraud-researcher. Created 2026-11-25.
#
# Fields: id, publisher, title, url, published, accessed, region, tier, used_for, notes.
# Tiers: 1 EU agency/body · 2 national CERT/CSIRT · 3 other national authority, consumer body, banking association,
#        state helpline · 4 NGO, operator, industry or news (supporting only, never the only source for a claim).
# used_for: case ids J1-J4, T1-T4, and HELP (help screen "Kde nájsť pomoc").
#
# Provenance: many rows are reused from the Slovak edition of Scam Atlas (fraud-researcher, opened 2026-11-23/24).
# accessed = 2026-11-25 means the page was opened again in this session (quotes in notes are from that visit).
# An older accessed date means the row is reused unchanged and was NOT re-opened in this session.
# Non-EU European sources (Swiss NCSC) are marked region CH: they are supporting only and do NOT satisfy Red Line 6.
#
# Real names in notes (games, platforms, apps, people) are reference only. Never put them in game content (Red Line 1).

sources:

  # =============================================================== EU (tier 1)
  - id: eu-europol-mule-jobs
    publisher: Europol (EMMA campaign)
    title: "Money Mule - job offers (flyer)"
    url: https://www.europol.europa.eu/sites/default/files/documents/emma_flyer_job_offers.pdf
    published: n/d
    accessed: 2026-11-25
    region: EU
    tier: 1
    used_for: [T1]
    notes: "Re-opened 2026-11-25. Red flags: 'Unsolicited contact promising easy money'; overseas companies recruiting 'local/national agents'; all communication and transactions online; the role requires moving money through your own bank account; no education or experience required. Most targeted: 'Unemployed, students and people in economic distress', 'People under 35, including minors'. If involved: stop sending money at once, tell your bank or payment provider, report to national police. English, EU-wide, undated."

  - id: eu-europol-iocta-2026
    publisher: Europol
    title: "Internet Organised Crime Threat Assessment (IOCTA) 2026"
    url: https://www.europol.europa.eu/cms/sites/default/files/documents/IOCTA-2026.pdf
    published: 2026-04-28
    accessed: 2026-11-25
    region: EU
    tier: 1
    used_for: [T1, T2]
    notes: "Re-opened 2026-11-25. p. 14: money laundering services 'increasingly accessible to minors and young adults, also via social media \"get-rich\" schemes'; 'Minors may unknowingly engage in money laundering by renting out wallets or receiving crypto \"gifts\" from cybercriminals.' p. 28: 'Infostealers persisted as a key enabler for the entire spectrum of cyber-attacks in 2025.' Does NOT mention games, cheats or cracked software. p. 34 'Offenders often target potential victims on gaming platforms popular among children' is in the CHILD SEXUAL EXPLOITATION chapter: never cite it for J1 or any scam case. No deepfake or celebrity-ad content. SIM swapping only in passing (criminal collectives)."

